aid: substrate
name: Substrate
description: >-
  Substrate is a semiconductor manufacturing company building America's
  next-generation chip foundry, with the stated mission of returning the United
  States to dominance in advanced semiconductor fabrication. Rather than
  designing chips, the company is inventing manufacturing technology intended to
  extend Moore's Law while lowering the cost of building state-of-the-art fabs
  and the wafers they produce. Substrate is a hard-tech / advanced-manufacturing
  venture backed by General Catalyst; it is a physical-infrastructure company and
  does not publish a public developer API, SDKs, or developer documentation. This
  API Evangelist profile was surfaced from the General Catalyst portfolio and
  enriched with the provider's public identity and security surface.
